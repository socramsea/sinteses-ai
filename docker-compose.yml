services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [sintese-net]

  api:
    build: .
    env_file: .env
    depends_on: [redis]
    # Sem porta pública direta: Nginx/Cloudflare na frente (host comprometido => zero endpoint novo exposto)
    expose: ["8080"]
    ports: ["8081:8080"]
    networks: [sintese-net]
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.workers.worker"]
    env_file: .env
    depends_on: [redis]
    networks: [sintese-net]
    restart: unless-stopped
    volumes:
      - ./.work:/srv/.work
      - ./out:/srv/out

volumes:
  redis-data:

networks:
  sintese-net:
    driver: bridge
